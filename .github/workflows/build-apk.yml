name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        run: |
          # Buscar la carpeta donde residen los archivos de Gradle
          BUILD_FILE=$(find . \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "No se encontró un proyecto Gradle. Se omite la compilación."
            exit 0
          fi
          BUILD_DIR=$(dirname "$BUILD_FILE")
          echo "Compilando en el directorio: $BUILD_DIR"
          cd "$BUILD_DIR"
          gradle assembleDebug --stacktrace

      - name: Subir instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: MisGastos-APK
          path: "**/*.apk"
